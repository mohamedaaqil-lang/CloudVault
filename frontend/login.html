<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CloudVault - Secure Student Document Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <span>☁️</span>
                <span>CloudVault</span>
            </a>
            <p class="auth-subtitle">Sign in to access your secure academic vault</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="email">Student / Admin Email</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="student@university.edu" 
                    required 
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Sign In
            </button>
        </form>

        <!-- Quick Demo Accounts for Evaluators & Local Development -->
        <div class="demo-credentials-box">
            <p>⚡ Quick Demo Testing Accounts:</p>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="loginWithDemo('student')">
                    Demo Student
                </button>
                <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="loginWithDemo('admin')">
                    Demo Admin
                </button>
            </div>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="register.html" style="font-weight: 600;">Create Account</a>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script type="module">
        import { initAuthListener, handleLogin, loginWithDemo } from "./js/auth.js";
        initAuthListener("auth_page");
    </script>
</body>
</html>
