<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CloudVault - Secure Student Document Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <span>☁️</span>
                <span>CloudVault</span>
            </a>
            <p class="auth-subtitle">Create your personal student cloud document vault</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input 
                    type="text" 
                    id="fullName" 
                    class="form-control" 
                    placeholder="e.g. John Doe" 
                    required 
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Student Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="john.doe@university.edu" 
                    required 
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password (min. 6 characters)</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="••••••••" 
                    required 
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="form-control" 
                    placeholder="••••••••" 
                    required 
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html" style="font-weight: 600;">Sign In</a>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script type="module">
        import { initAuthListener, handleRegister } from "./js/auth.js";
        initAuthListener("auth_page");
    </script>
</body>
</html>
